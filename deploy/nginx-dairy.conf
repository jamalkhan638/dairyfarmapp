# /etc/nginx/sites-available/dairy  (then: ln -s ../sites-available/dairy /etc/nginx/sites-enabled/)
# After enabling, get the free HTTPS certificate with:  certbot --nginx -d dairy.supplymeadow.site
server {
    listen 80;
    server_name dairy.supplymeadow.site;

    # Photos and receipts are up to 10 MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
